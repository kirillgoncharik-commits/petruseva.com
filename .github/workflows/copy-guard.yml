name: Site content and release checks
on:
  push:
  pull_request:
jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shared author content
        run: node scripts/build-site.mjs
      - name: Check author text, online format and removed prices
        run: python3 scripts/check_copy.py
      - name: Validate metadata and internal links
        run: node scripts/validate-site.mjs
      - name: Validate anchors and assets
        run: python3 scripts/check_links.py
      - name: Check generated HTML is committed
        run: git diff --exit-code
